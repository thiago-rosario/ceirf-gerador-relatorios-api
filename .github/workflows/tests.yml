name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ceirf_relatorios
          POSTGRES_USER: ceirf
          POSTGRES_PASSWORD: ceirf_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceirf -d ceirf_relatorios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ceirf_relatorios
      DB_USERNAME: ceirf
      DB_PASSWORD: ceirf_dev

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
